[project]
name = "niche-hunter"
version = "0.1.0"
description = "Nightly pipeline + dashboard scoring YouTube niche clusters on demand-supply gap, openness, RPM, sustainability and risk."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.optional-dependencies]
# Installed per-collector as each source is ported. Keeping them optional means a
# missing Google Ads / Reddit credential set never blocks the core nightly job.
postgres = ["psycopg[binary]>=3.1"]
trends = ["trendspy>=0.1", "pandas>=2.2", "numpy>=1.26"]
reddit = ["praw>=7.7"]
ads = ["google-ads>=25.0", "pandas>=2.2"]
# The evidence surface (ADR-0052). Optional for the same reason the collectors are:
# the nightly must never depend on a rendering library, and `nh/api/` is deliberately
# free of web imports so nothing web-shaped can reach the pipeline.
web = ["streamlit>=1.37", "pandas>=2.2"]

[project.scripts]
nh = "nh.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.5",
    # For `streamlit.testing.v1.AppTest`, which runs a page in-process with no socket —
    # so the web tests satisfy the suite-wide network block rather than being exempted
    # from it. The web tests `importorskip` anyway, so the core suite stays green without.
    "streamlit>=1.37",
    "pandas>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nh"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"nh/cli.py" = ["B008"]        # typer.Option in a default IS the Typer API
"legacy/*" = ["ALL"]           # frozen prototypes; ported file-by-file, never linted in place
"nh/db/migrations/*" = ["I001"]
# Real Wikipedia article titles, pasted verbatim. Some genuinely contain an en
# dash (Rokotov–Faibishenko_case) and "correcting" it to a hyphen would silently
# break the lookup — the metric would read NULL and look like absent demand.
"nh/seeds.py" = ["RUF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:nh.*"]
