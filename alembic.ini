[alembic]
script_location = nh/db/migrations
prepend_sys_path = .
# Explicit, or alembic warns and falls back to splitting on spaces/commas/colons.
path_separator = os
# sqlalchemy.url is intentionally absent — env.py reads NH_DATABASE_URL through
# nh.config so there is exactly one source of truth for the connection string.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
